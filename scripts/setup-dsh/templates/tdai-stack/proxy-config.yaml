# TDAI MemoryProxy — local deployment for DeepSeek Harness
# Generated by scripts/setup-dsh/setup.sh — re-run setup to regenerate.
# Mirrors the full-stack config (auth + tdai + sessionInit + sqlite storage),
# endpoints pointed at the local gateway.
server:
  host: 127.0.0.1
  port: 8096
  forwardTimeoutMs: 600000

upstream:
  url: "__PROXY_UPSTREAM_URL__"
  apiKey: "__PROXY_UPSTREAM_API_KEY__"

log:
  file: __DSH_HOME__/tdai-stack/logs
  level: info
  backend: console

tdai:
  enabled: true
  endpoint: "http://127.0.0.1:8420"
  apiKey: "local"
  serviceId: default
  memory:
    enabled: true
    inject: true
    writeL0: true
    recallL1: true
    injectL2L3: true

skill:
  endpoint: "http://127.0.0.1:8420"
  serviceToken: "local"

auth:
  enabled: true
  url: "http://127.0.0.1:8420"
  timeoutMs: 5000

sessionInit:
  enabled: true
  maxRetries: 3
  # Virtual "No task" entry prepended to every team's task list; guarantees
  # registration completes (and memory injection happens) when a team has no tasks.
  defaultTaskId: "none"
  injectAgentContext: true
  injectTaskContext: true
  headerAutoSelect:
    enabled: true
    teamHeader: "x-team-id"
    agentHeader: "x-agent-id"
    taskHeader: "x-task-id"
    onMismatch: "form"

costGuard:
  enabled: false

injection:
  enabled: true
  # Base URL embedded in injected <skill_tools>/<tdai_memory_tools> curl templates.
  externalGatewayUrl: "http://127.0.0.1:8096"
  injectors:
    - skill
    - tdai-memory

redis:
  enabled: false

# Persistent session/binding/injection state (single-instance local deployment;
# replaces Redis). Required for memory-bridge L2 binding lookups.
storage:
  enabled: true
  backend: sqlite
  ttlDays: 7
