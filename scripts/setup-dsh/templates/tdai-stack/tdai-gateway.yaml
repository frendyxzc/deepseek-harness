# TDAI standalone gateway — local deployment for DeepSeek Harness
# Generated by scripts/setup-dsh/setup.sh — re-run setup to regenerate.
# Standalone + sqlite, embeddings enabled (same model/dims as the previous
# dsh-tdai-memory plugin so existing vectors in the data dir stay valid).
deployMode: standalone
stateBackend: local
server:
  port: 8420
  host: 127.0.0.1
data:
  baseDir: "__MEMORY_DATA_DIR__"
llm:
  baseUrl: "__TDAI_LLM_BASE_URL__"
  apiKey: "__TDAI_LLM_API_KEY__"
  model: "__TDAI_LLM_MODEL__"
  maxTokens: 32000
  timeoutMs: 300000
memory:
  promptMode: chat
  capture: { enabled: true }
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: hybrid
    timeoutMs: 5000
  storeBackend: sqlite
  embedding:
    provider: "openai"
    baseUrl: "__TDAI_LLM_BASE_URL__"
    apiKey: "__TDAI_LLM_API_KEY__"
    model: "text-embedding-v4"
    dimensions: 1024
  bm25:
    enabled: true
    language: "zh"

skill:
  enabled: true
  routing:
    mode: bm25
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
    queue:
      backend: local
      keyPrefix: tdai
      resultTtlSeconds: 86400
      lockTtlMs: 600000
      maxRetries: 2
      retryBackoffsMs: [5000, 15000]
  resources:
    maxResourceSizeBytes: 5000000
