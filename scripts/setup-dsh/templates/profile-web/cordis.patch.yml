# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# Feishu chat capability (send + receive): the seam, the Bot API provider, the
# model-facing send tool, the long-connection receive router (one agent per
# chat), and the status gateway the Settings > Plugins > IM tab reads.
# feishu-approval answers approval/request with interactive cards in the owning
# chat (or the configured fallback chat for sessions with no Feishu binding,
# e.g. Web GUI), so remote operators approve protected operations from Feishu.
# feishu-question answers ask_user_question (and plan-mode reviews) of
# Feishu-bound chats with interactive form cards; unbound sessions keep the
# Web default provider.
# The Bot API provider registers one bot, `main`: its app id is inlined into
# `bots[].appId` (substituted from FEISHU_APP_ID below) and its secret comes
# from FEISHU_APP_SECRET (root .env) through the compose-time credentials —
# secrets never live in this file or in the settings section. The `main` entry
# is the settings section's base, so the IM tab shows it with the app id
# pre-filled, and its team/agent can be mapped from the core catalog dropdowns.
#
# `__WORKSPACE__`, `__FEISHU_APP_ID__`, and `__FALLBACK_CHAT_ID__` are
# placeholders replaced by scripts/setup-dsh/setup.sh at install time.
- insert:
    - id: feishu
      name: '@deepseek-ai/dsh-feishu'

    - id: feishu-bot
      name: '@deepseek-ai/dsh-feishu-bot'
      config:
        bots:
          - id: main
            appId: __FEISHU_APP_ID__
        credentials:
          - id: main
            appIdEnv: FEISHU_APP_ID
            appSecretEnv: FEISHU_APP_SECRET

    - id: tool-feishu
      name: '@deepseek-ai/dsh-tool-feishu'

    - id: feishu-receive
      name: '@deepseek-ai/dsh-feishu-receive'
      config:
        cwd: __WORKSPACE__

    - id: feishu-status
      name: '@deepseek-ai/dsh-feishu-status'

    - id: feishu-approval
      name: '@deepseek-ai/dsh-feishu-approval'
      config:
        timeoutMs: 300000
        fallbackChatId: __FALLBACK_CHAT_ID__

    - id: feishu-question
      name: '@deepseek-ai/dsh-feishu-question'
      config:
        timeoutMs: 300000

# ── Model routes and defaults ────────────────────────────────────────────────
# These id-targeted config rows are the deployment's settings. A pre-0.1.7
# deployment kept them in `~/.dsh/settings.yaml`, which the first boot imports
# into the active profile and renames to `settings.yaml.imported`; this layer is
# the only file to edit afterwards.
# Both LLM entries route through the local TDAI MemoryProxy (team memory
# injection + L0 capture). The proxy authenticates with PROXY_USER_KEY
# (~/.dsh/.credentials.yaml) and forwards to the MaaS upstream with its own
# server-side key, so no key is written here. See TencentDB-Agent-Memory
# INSTALL.md, "Using Proxy with DeepSeek Harness".
- id: ui-settings-general
  config:
    # Records the shipped welcome notice as already read, so a freshly
    # bootstrapped profile boots quiet. The web-app bundle already pins
    # `agent-preset-registry.default: standard`, so no preset row is repeated here.
    welcomeNoticeVersion: 2026-08-13.1

- id: llm-pi-ai
  config:
    providers:
      dashscope:
        displayName: DashScope Qwen
        apiKeyEnv: PROXY_USER_KEY
        api: openai-completions
        # No trailing /v1: the client appends /chat/completions, matching the
        # proxy route /dsh/<spaceId>/chat/completions.
        baseURL: http://127.0.0.1:8096/dsh/default
        models:
          - id: qwen3.7-plus
            name: Qwen3.7 Plus
          - id: qwen3.8-max
            name: Qwen3.8 Max
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
          - id: deepseek-v4-pro-0813
            name: deepseek-v4-pro-0813
          - id: qwen3-vl-plus
            name: Qwen3 VL Plus
            input: [text, image]

- id: agent-default-model
  # llm-deepseek registers under provider id "deepseek-official". Both routes
  # send x-deepseek-harness-session-id, which the MemoryProxy uses to bind the
  # session (picker + injection + L0 capture); deepseek-official additionally
  # sends the anonymous x-deepseek-harness-user-id, which the pi-ai route has no
  # source for.
  config:
    provider: deepseek-official
    model: deepseek-v4-pro-0813

- id: llm-deepseek
  config:
    apiKeyEnv: PROXY_USER_KEY
    baseURL: http://127.0.0.1:8096/dsh/default
    reasoningEffort: high
    models:
      - id: deepseek-v4-pro-0813
        name: DeepSeek V4 Pro 0813
        contextWindow: 1000000
        maxTokens: 32768
      - id: qwen3.8-max
        name: Qwen3.8 Max
        contextWindow: 262144
        maxTokens: 32768
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        contextWindow: 1000000
        maxTokens: 32768
